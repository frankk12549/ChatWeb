<html lang="pt-BR">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #bootCover { position: fixed; inset: 0; z-index: 95; background: #075E54; }

  .phone { width: 100%; max-width: 430px; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; display: flex; flex-direction: column; background: #efeae2; position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.15); }

  .header { background: #075E54; color: #fff; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: calc(11px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 11px calc(12px + env(safe-area-inset-left)); flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.2); z-index: 5; }

  .header .info .status { font-size: 12px; opacity: .85; }
  .header .icons { display: flex; gap: 20px; font-size: 18px; opacity: .9; }
  .chat { flex: 1; overflow-y: auto; padding: 14px calc(10px + env(safe-area-inset-right)) 4px calc(10px + env(safe-area-inset-left)); background-color: #efeae2; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='%23d9d2c8' fill-opacity='0.4'><circle cx='7' cy='7' r='1.5'/><circle cx='30' cy='22' r='1.5'/><circle cx='52' cy='10' r='1.5'/><circle cx='18' cy='45' r='1.5'/><circle cx='45' cy='50' r='1.5'/></g></svg>"); display: flex; flex-direction: column; gap: 3px; }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
  .row { display: flex; margin-top: 3px; animation: pop .25s ease; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bubble { max-width: 80%; padding: 6px 9px 8px; border-radius: 8px; font-size: 14.7px; line-height: 1.4; color: #111b21; position: relative; box-shadow: 0 1px .5px rgba(0,0,0,.13); word-wrap: break-word; white-space: pre-wrap; }
  .in .bubble { background: #fff; border-top-left-radius: 0; }
  .out .bubble { background: #D9FDD3; border-top-right-radius: 0; }
  .bubble .time { font-size: 10.5px; color: #667781; float: right; margin: 6px -2px -4px 8px; }
  .out .bubble .time::after { content: " ✓✓"; color: #53bdeb; }
  .bubble img.media { width: 100%; border-radius: 6px; margin-bottom: 5px; display: block; }
  .bubble .legenda { padding: 3px 4px 0; white-space: pre-wrap; }
  .bubble.audio { display: flex; align-items: stretch; gap: 0; padding: 0; overflow: hidden; border-radius: 8px; max-width: 80%; }
  .bubble.audio.comtexto { flex-direction: column; }
  .audio-avatar { width: 36px; height: 36px; border-radius: 50%; background: #075E54; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; overflow: hidden; }
  .audio-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .audio-body { flex: 1; display: flex; flex-direction: column; padding: 8px 10px 6px; min-width: 0; }
  .audio-row { display: flex; align-items: center; gap: 8px; }
  .audio-play { width: 32px; height: 32px; border-radius: 50%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
  .audio-play svg { fill: #075E54; width: 18px; height: 18px; }
  .audio-track { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .audio-bar { position: relative; height: 4px; background: #c5ccd0; border-radius: 2px; cursor: pointer; overflow: visible; }
  .audio-bar-fill { height: 100%; background: #075E54; border-radius: 2px; width: 0%; transition: width .1s linear; pointer-events: none; }
  .audio-bar-dot { position: absolute; top: 50%; left: 0%; width: 12px; height: 12px; border-radius: 50%; background: #075E54; transform: translate(-50%, -50%); display: none; pointer-events: none; }
  .audio-bar:hover .audio-bar-dot, .audio-playing .audio-bar-dot { display: block; }
  .audio-times { display: flex; justify-content: space-between; align-items: center; }
  .audio-time { font-size: 11px; color: #667781; }
  .audio-speed { font-size: 10px; font-weight: 700; color: #075E54; background: none; border: 1.5px solid #075E54; border-radius: 4px; padding: 1px 5px; cursor: pointer; line-height: 1.2; flex-shrink: 0; }
  .audio-footer { display: flex; justify-content: flex-end; padding: 0 10px 4px; }
  .bubble.audio .legenda { padding: 4px 10px 6px; white-space: pre-wrap; font-size: 14px; line-height: 1.4; }
  .bubble.audio .time { font-size: 10.5px; color: #667781; margin-left: auto; padding-right: 2px; align-self: flex-end; }
  .bubble.rec { display: inline-flex; align-items: center; gap: 6px; }
  .bubble.rec .micrec { font-size: 16px; line-height: 1; animation: pulseMic 1s infinite; }
  @keyframes pulseMic { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .bubble.imagem { padding: 4px 4px 5px; max-width: 75%; }
  .bubble.imagem img.media { margin-bottom: 3px; }
  .bubble.imagem .legenda { padding: 3px 6px 0; }
  .typing { display: inline-flex; gap: 4px; padding: 12px 12px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .options { display: flex; flex-direction: column; gap: 7px; padding: 6px 4px 12px; align-items: flex-start; }
  .opt { background: #fff; color: #008069; border: 1px solid #008069; padding: 11px 16px; border-radius: 8px; font-size: 14.5px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.12); max-width: 80%; text-align: center; transition: transform .08s, background .15s; }
  .opt:hover { background: #f0faf6; }
  .opt:active { transform: scale(.97); }
  .opt.cta { background: #00A884; color: #fff; font-weight: 600; box-shadow: 0 2px 6px rgba(0,168,132,.45); }
  .opt.cta:hover { background: #008f72; }
  .inputbar { flex-shrink: 0; background: #f0f2f5; padding: 8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; }
  .inputbar .campo { flex: 1; background: #fff; border-radius: 22px; padding: 10px 16px; color: #111b21; font-size: 14px; border: none; outline: none; }
  .inputbar .send { width: 42px; height: 42px; border-radius: 50%; background: #00A884; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; cursor: pointer; }
  .inputbar .anexo { border: none; background: transparent; font-size: 20px; line-height: 1; width: 34px; height: 40px; flex-shrink: 0; cursor: pointer; opacity: .8; padding: 0; }
  .inputbar .anexo:hover { opacity: 1; }
  .inputbar .anexo.gravando { color: #fff; background: #c0392b; border-radius: 50%; width: 40px; opacity: 1; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2a3942; color: #fff; padding: 11px 20px; border-radius: 24px; font-size: 14px; z-index: 80; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<body>
  <div id="bootCover"></div>
  <div class="phone">
    <div class="header">
      <div class="avatar" id="avatar"></div>
      <div class="info">
        <div class="name" id="hdrName"></div>
        <div class="status" id="hdrStatus">online</div>
      </div>
      <div class="icons"><span>📞</span></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <input type="file" id="fileCliente" accept="image/*,application/pdf" style="display:none">
      <button class="anexo" id="btnAnexo" title="Enviar imagem ou comprovante">📎</button>
      <button class="anexo" id="btnMicCliente" title="Gravar áudio">🎤</button>
      <input class="campo" id="campoCliente" placeholder="Digite uma mensagem…" autocomplete="off">
      <div class="send" id="btnEnviar">➤</div>

  </div>
  <div class="toast" id="toast"></div>
<script>
const CONFIG_PADRAO={empresa:"Sua Empresa",avatarLetra:"S",avatarFoto:"",whatsapp:"5511999999999",linkPagamento:"",linksPagamento:[],velocidadeDigitando:1100,rastreioURL:"",mostrarEmConversas:true};
const BLOCOS_PADRAO=[{tipo:"texto",texto:"Olá! 👋 Seja bem-vindo(a) à *Sua Empresa*.",delay:1},{tipo:"texto",texto:"Deixa eu te mostrar rapidinho como a gente pode te ajudar. 😊",delay:2},{tipo:"texto",texto:"Nosso *Plano Completo* inclui tudo que você precisa:\n\n✅ Benefício 1\n✅ Benefício 2\n✅ Benefício 3\n✅ Suporte no WhatsApp",delay:2.5},{tipo:"texto",texto:"E hoje está com condição especial: de R$ 297 por apenas *R$ 197* 🔥",delay:2},{tipo:"botao",text:"💳 Pagar agora",destino:"pagamento",cta:true,delay:1},{tipo:"botao",text:"💬 Falar com um atendente",destino:"whatsapp",cta:false,delay:0.5}];
const PROJ_KEY="atendimento_projeto_v1";
const chat=document.getElementById("chat");
function encodeDados(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));}
function decodeDados(str){return JSON.parse(decodeURIComponent(escape(atob(str))));}
function clone(o){return JSON.parse(JSON.stringify(o));}
function novoId(){return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const PARAMS=new URLSearchParams(location.search);
const TEM_LINK=!!PARAMS.get("f");
const URL_SLUG=(function(){const p=location.pathname.replace(/^\//,"").replace(/\/+$/,"");if(!p||p==="index.html"||p==="lead.html")return "";return p;})();
const TEM_SLUG=!!URL_SLUG&&!TEM_LINK;
let FLUXO_EMBUTIDO=null;
try{const _e=document.getElementById("fluxoEmbutido");if(_e&&_e.textContent.trim())FLUXO_EMBUTIDO=JSON.parse(_e.textContent);}catch(e){}
const BAKED=!TEM_LINK&&!TEM_SLUG&&!!FLUXO_EMBUTIDO;
function fluxoAntigoParaBlocos(fluxo,inicio){const blocos=[];const chaves=Object.keys(fluxo);const ordem=(inicio&&fluxo[inicio])?[inicio].concat(chaves.filter(k=>k!==inicio)):chaves;ordem.forEach(id=>{const p=fluxo[id]||{};(p.msgs||[]).forEach(m=>{if(m&&typeof m==="object"&&m.tipo==="audio")blocos.push({tipo:"audio",audio:m.audio,legenda:m.legenda||"",delay:2.5});else if(m&&typeof m==="object"&&m.tipo==="imagem")blocos.push({tipo:"imagem",img:m.img,legenda:m.legenda||"",delay:2});else if(typeof m==="string")blocos.push({tipo:"texto",texto:m,delay:1.5});});(p.options||[]).forEach(o=>{if(o.url==="PAGAMENTO")blocos.push({tipo:"botao",text:o.text,destino:"pagamento",cta:!!o.cta,delay:1});else if(o.url==="WHATSAPP")blocos.push({tipo:"botao",text:o.text,destino:"whatsapp",cta:!!o.cta,delay:1});else if(o.url)blocos.push({tipo:"botao",text:o.text,destino:"link",link:o.url,cta:!!o.cta,delay:1});});});return blocos.length?blocos:clone(BLOCOS_PADRAO);}
function normalizarFluxoSolto(d){const config=Object.assign({},CONFIG_PADRAO,d.config||{});let blocos=Array.isArray(d.blocos)?d.blocos:(d.fluxo?fluxoAntigoParaBlocos(d.fluxo,d.inicio):[]);return{config:config,blocos:blocos};}
function carregarProjeto(){let p=null;try{const s=localStorage.getItem(PROJ_KEY);if(s)p=JSON.parse(s);}catch(e){}if(!p||!Array.isArray(p.fluxos)||!p.fluxos.length){let base=null;try{const s2=localStorage.getItem("atendimento_dados_v2");if(s2)base=JSON.parse(s2);}catch(e){}if(!base){try{const s1=localStorage.getItem("atendimento_dados_v1");if(s1)base=JSON.parse(s1);}catch(e){}}const f=base?normalizarFluxoSolto(base):{config:clone(CONFIG_PADRAO),blocos:[]};const id=novoId();p={fluxos:[{id:id,nome:"Meu atendimento",config:f.config,blocos:f.blocos}],atual:id};}p.fluxos.forEach(fx=>{fx.config=Object.assign({},CONFIG_PADRAO,fx.config||{});if(!fx.id)fx.id=novoId();if(!fx.nome)fx.nome="Fluxo";});if(!p.atual||!p.fluxos.find(fx=>fx.id===p.atual))p.atual=p.fluxos[0].id;return p;}
let PROJETO=null;let CONFIG,BLOCOS;let OWNER_ID=null;let FLOW_ID=null;let LINK_CURTO=null;
let API_TOKEN=localStorage.getItem("chatweb_api_token")||null;
async function apiCall(method,path,body){const opts={method,headers:{"Content-Type":"application/json"}};if(API_TOKEN)opts.headers["Authorization"]="Bearer "+API_TOKEN;if(body)opts.body=JSON.stringify(body);try{const r=await fetch("/api/"+path,opts);const data=await r.json();if(!r.ok)throw new Error(data.erro||"Erro na API");return data;}catch(e){return null;}}
async function apiBuscarFluxoPorSlug(slug){return await apiCall("GET","fluxos?slug="+encodeURIComponent(slug));}
async function apiBuscarArquivos(fluxoId){return await apiCall("GET","arquivos?fluxo_id="+encodeURIComponent(fluxoId));}
async function apiEnviarMensagem(sessaoId,fluxoId,remetente,texto){return await apiCall("POST","mensagens",{sessao_id:sessaoId,fluxo_id:fluxoId,remetente,texto});}
async function apiRegistrarEvento(fluxoId,sessaoId,tipo,dados){return await apiCall("POST","eventos",{fluxo_id:fluxoId,sessao_id:sessaoId,tipo,dados});}
if(TEM_LINK){const raw=PARAMS.get("f");let d=null;try{d=decodeDados(raw);}catch(e){d=null;}if(d&&(Array.isArray(d.blocos)||d.fluxo||d.config)){const f=normalizarFluxoSolto(d);CONFIG=f.config;BLOCOS=f.blocos;OWNER_ID=d.owner||null;FLOW_ID=d.fid||null;}else{LINK_CURTO=raw;CONFIG=clone(CONFIG_PADRAO);BLOCOS=[];}}else if(TEM_SLUG){PROJETO=carregarProjeto();const fx=PROJETO.fluxos.find(f=>f.slug===URL_SLUG);if(fx){CONFIG=fx.config;BLOCOS=fx.blocos;PROJETO.atual=fx.id;FLOW_ID=fx.id;}else{CONFIG=clone(CONFIG_PADRAO);BLOCOS=[];}}else if(BAKED){const f=normalizarFluxoSolto(FLUXO_EMBUTIDO);CONFIG=f.config;BLOCOS=f.blocos;OWNER_ID=FLUXO_EMBUTIDO.owner||null;FLOW_ID=FLUXO_EMBUTIDO.fid||null;}else{CONFIG=clone(CONFIG_PADRAO);BLOCOS=[];}
const SESSAO=(function(){try{let s=localStorage.getItem("falow_sessao");if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("falow_sessao",s);}return s;}catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36);}})();
let jaAbriu=false;let chegouPgto=false;let aguardandoResposta=false;let resolverResposta=null;const RESPOSTAS={};let chatLiberado=true;
const JA_SALVOU_FLUXO=(function(){try{return localStorage.getItem("falow_salvou_"+SESSAO)==="1";}catch(e){return false;}})();function marcarFluxoSalvo(){try{localStorage.setItem("falow_salvou_"+SESSAO,"1");}catch(e){}}
function setChatBloqueado(bloqueado){const inp=document.getElementById("campoCliente");const send=document.getElementById("btnEnviar");if(inp){inp.disabled=!!bloqueado;inp.placeholder=bloqueado?"🔒 Toque em \"Falar com atendente\" para conversar":"Digite uma mensagem…";}if(send){send.style.opacity=bloqueado?".4":"1";send.style.pointerEvents=bloqueado?"none":"auto";}["btnAnexo","btnMicCliente"].forEach(id=>{const b=document.getElementById(id);if(b)b.style.opacity=bloqueado?".4":".8";});}
function salvarResposta(){if(!OWNER_ID)return;apiRegistrarEvento(FLOW_ID,SESSAO,"resposta",RESPOSTAS);}
function track(evento){if(CONFIG.rastreioURL){const dados=JSON.stringify({evento:evento,empresa:CONFIG.empresa,sessao:SESSAO,origem:location.href});try{navigator.sendBeacon(CONFIG.rastreioURL,dados);}catch(e){}}if(OWNER_ID){apiRegistrarEvento(FLOW_ID,SESSAO,evento,{});}}
function esperarResposta(b){return new Promise(resolve=>{aguardandoResposta=true;const campo=document.getElementById("campoCliente");setChatBloqueado(false);const tipo=b&&b.tipoCampo;campo.type=tipo==="email"?"email":tipo==="telefone"?"tel":tipo==="numero"?"number":"text";campo.placeholder=tipo==="email"?"Digite seu e-mail…":tipo==="telefone"?"Digite seu telefone…":tipo==="nome"?"Digite seu nome…":"Digite sua resposta…";campo.focus();resolverResposta=valor=>{aguardandoResposta=false;resolverResposta=null;campo.type="text";campo.placeholder="Digite uma mensagem…";resolve(valor);};});}
function esperarRespostaLivre(){return new Promise(resolve=>{aguardandoResposta=true;const campo=document.getElementById("campoCliente");setChatBloqueado(false);campo.type="text";campo.placeholder="Digite sua resposta…";campo.focus();resolverResposta=valor=>{aguardandoResposta=false;resolverResposta=null;campo.type="text";campo.placeholder="Digite uma mensagem…";resolve(valor);};});}
function aplicarMetadata(cfg){var meta=cfg.meta||{};var titulo=meta.titulo||cfg.empresa||"ChatWeb";document.title=titulo;var setMeta=function(prop,content){var el=document.querySelector('meta[property="'+prop+'"]')||document.querySelector('meta[name="'+prop+'"]');if(!el){el=document.createElement("meta");if(prop.startsWith("og:")||prop.startsWith("twitter:"))el.setAttribute("property",prop);else el.setAttribute("name",prop);document.head.appendChild(el);}el.setAttribute("content",content);};if(meta.titulo){setMeta("og:title",meta.titulo);setMeta("twitter:title",meta.titulo);}else if(cfg.empresa){setMeta("og:title",cfg.empresa);setMeta("twitter:title",cfg.empresa);}if(meta.descricao){setMeta("og:description",meta.descricao);setMeta("description",meta.descricao);setMeta("twitter:description",meta.descricao);}setMeta("og:type","website");if(meta.favicon){var link=document.querySelector("link[rel='icon']")||document.createElement("link");var isSvg=meta.favicon.slice(-4)===".svg"||meta.favicon.indexOf("image/svg")!==-1;link.rel="icon";link.type=isSvg?"image/svg+xml":"image/png";link.href=meta.favicon;if(!link.parentNode)document.head.appendChild(link);}if(meta.ogImage){setMeta("og:image",meta.ogImage);setMeta("twitter:image",meta.ogImage);}aplicarVisual();}
function aplicarVisual(){document.getElementById("hdrName").textContent=CONFIG.empresa;const av=document.getElementById("avatar");if(CONFIG.avatarFoto)av.innerHTML='<img src="'+CONFIG.avatarFoto+'" alt="">';else{av.innerHTML="";av.textContent=CONFIG.avatarLetra;}}
function agora(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function scrollDown(){chat.scrollTop=chat.scrollHeight;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function formatar(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*(.+?)\*/g,"<strong>$1</strong>");}

async function carregarSlug(){const fx=PROJETO&&PROJETO.fluxos?PROJETO.fluxos.find(f=>f.slug===URL_SLUG):null;if(fx&&fx.blocos&&fx.blocos.length){CONFIG=fx.config;BLOCOS=fx.blocos;PROJETO.atual=fx.id;FLOW_ID=fx.id;OWNER_ID=fx.owner_id||null;aplicarMetadata(fx.config||{});tocarFluxo();return;}try{const fluxo=await apiBuscarFluxoPorSlug(URL_SLUG);if(fluxo&&fluxo.id&&!fluxo.erro){var blocos=typeof fluxo.blocos==="string"?JSON.parse(fluxo.blocos):(fluxo.blocos||[]);try{var arq=null;try{var rr=await fetch("/api/arquivos?fluxo_id="+encodeURIComponent(fluxo.id));arq=await rr.json();}catch(e1){}if(!arq||!Array.isArray(arq)||!arq.length){try{arq=await apiBuscarArquivos(fluxo.id);}catch(e2){}}if(arq&&arq.length)blocos=restaurarArquivos(blocos,arq);}catch(e){}var cfg=typeof fluxo.config==="string"?JSON.parse(fluxo.config):(fluxo.config||{});CONFIG=cfg;BLOCOS=blocos;OWNER_ID=fluxo.owner_id||null;FLOW_ID=fluxo.id;aplicarMetadata(cfg);tocarFluxo();return;}}catch(e){}tocarFluxo();}
async function carregarLinkCurto(){let d=null;try{const fluxo=await apiCall("GET","fluxos/"+LINK_CURTO);if(fluxo&&!fluxo.erro){var blocos=fluxo.blocos||[];try{var arq=null;try{var rr=await fetch("/api/arquivos?fluxo_id="+encodeURIComponent(fluxo.id));arq=await rr.json();}catch(e1){}if(!arq||!Array.isArray(arq)||!arq.length){try{arq=await apiBuscarArquivos(fluxo.id);}catch(e2){}}if(arq&&arq.length)blocos=restaurarArquivos(blocos,arq);}catch(e){}d={config:fluxo.config,blocos:blocos,owner:fluxo.owner_id,fid:fluxo.id};}}catch(e){}if(d){const f=normalizarFluxoSolto(d);CONFIG=f.config;BLOCOS=f.blocos;OWNER_ID=d.owner||null;FLOW_ID=d.fid||null;aplicarMetadata(f.config||{});const ativo=await funilAtivo(FLOW_ID||LINK_CURTO);if(!ativo){mostrarFunilIndisponivel();return;}if(window.self===window.top)mostrarAvisoTeste();setTimeout(()=>tocarFluxo(),300);}else{balaoBot("Ops! Não consegui carregar este atendimento. 😕 Confira se o link está completo.");}}
try{document.getElementById("bootCover").remove();}catch(e){}
window.addEventListener("load",()=>{if(LINK_CURTO)carregarLinkCurto();else if(TEM_SLUG)carregarSlug();else{CONFIG=clone(CONFIG_PADRAO);BLOCOS=clone(BLOCOS_PADRAO);aplicarVisual();tocarFluxo();}iniciarPollingCliente();});
</script>
